# Xcode project description for XcodeGen (https://github.com/yonaskolb/XcodeGen):  xcodegen generate
# The app is a native window around the web tool: web/synchromy.html is bundled as a resource.
# Before building, set your own Apple team (DEVELOPMENT_TEAM) and bundle identifier.
name: SynchromyMac
options:
  bundleIdPrefix: design.etienne
  deploymentTarget:
    macOS: "13.0"
targets:
  SynchromyMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["*.entitlements", "Info.plist"]
      - path: Resources
        buildPhase: resources
      - path: ../../web/synchromy.html
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Synchromy
        PRODUCT_BUNDLE_IDENTIFIER: design.etienne.synchromy.tv
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Synchromy.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_OBJC_ARC: YES
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
        GCC_OPTIMIZATION_LEVEL: s
